name: CI

# A pull request is checked by building the site the way the deploy builds it:
# the wunderland source is cloned, TypeDoc generates the API reference and
# Docusaurus builds every page. The deploy passes a token to the clone; this
# build clones the public repository without one.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Each page's "Last updated" date is read from git history.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: node scripts/pull-source.mjs
      - run: npm run build
        env:
          NODE_ENV: production
